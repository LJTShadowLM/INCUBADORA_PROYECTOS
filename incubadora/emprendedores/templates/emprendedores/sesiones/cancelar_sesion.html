{% extends "emprendedores/base.html" %}
{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-danger text-white"><h4>Cancelar Sesión</h4></div>
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3"><label class="form-label">Motivo de cancelación *</label><textarea name="motivo" class="form-control" rows="4" required></textarea></div>
                        <button type="submit" class="btn btn-danger">Confirmar Cancelación</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
