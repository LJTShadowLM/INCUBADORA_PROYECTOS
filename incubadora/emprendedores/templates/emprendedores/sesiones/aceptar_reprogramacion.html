{% extends "emprendedores/base.html" %}
{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-success text-white"><h4>Reprogramación</h4></div>
                <div class="card-body">
                    <p>Nueva fecha: {{ propuesta.fecha_propuesta|date:"d/m/Y H:i" }}</p>
                    <p>Motivo: {{ propuesta.mensaje }}</p>
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3"><label class="form-label">¿Aceptas la reprogramación?</label>
                            <select name="accion" class="form-select">
                                <option value="aceptar">Aceptar</option>
                                <option value="rechazar">Rechazar</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary">Confirmar</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
