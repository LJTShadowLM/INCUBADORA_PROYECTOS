{% extends "emprendedores/base.html" %}

{% block content %}
<div class="container mt-5">
    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <div class="d-flex justify-content-between align-items-center">
                <h3 class="mb-0">Panel de Administración</h3>
                <div>
                    <!-- Botón para ver mensajes -->
                    <a href="{% url 'ver_mensajes' %}" class="btn btn-light me-2">
                        <i class="bi bi-envelope"></i> Ver Mensajes
                    </a>
                    <!-- Botón para configurar correo -->
                    <a href="{% url 'gestionar_correo' %}" class="btn btn-light me-2">
                        <i class="bi bi-envelope"></i> Configurar Correo
                    </a>
                    <a href="{% url 'registrar_tutor' %}" class="btn btn-light me-2">
                        <i class="bi bi-person-plus"></i> Registrar Tutor
                    </a>
                </div>
            </div>
        </div>        
        <div class="card-body">
            <div class="row mt-3">
                <div class="col-md-4 mb-3">
                    <a href="{% url 'lista_tutores' %}" class="btn btn-primary w-100 py-3">
                        <i class="bi bi-people-fill me-2"></i> Ver Tutores
                    </a>
                </div>
                <div class="col-md-4 mb-3">
                    <a href="{% url 'lista_emprendedores' %}" class="btn btn-success w-100 py-3">
                        <i class="bi bi-person-badge me-2"></i> Ver Emprendedores
                    </a>
                </div>
                <div class="col-md-4 mb-3">
                    <a href="{% url 'lista_proyectos' %}" class="btn btn-info w-100 py-3 text-white">
                        <i class="bi bi-folder me-2"></i> Ver Proyectos
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Modal para enviar mensajes -->
<div class="modal fade" id="mensajeModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Enviar Mensaje</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form method="post" action="{% url 'enviar_mensaje' %}">
                {% csrf_token %}
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Enviar a:</label>
                        <div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="tipo_destinatario" id="tipo_tutor" value="tutor" checked>
                                <label class="form-check-label" for="tipo_tutor">Tutor</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="tipo_destinatario" id="tipo_emprendedor" value="emprendedor">
                                <label class="form-check-label" for="tipo_emprendedor">Emprendedor</label>
                            </div>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Seleccionar destinatario:</label>
                        <select class="form-select" id="destinatario_select" name="destinatario_id" required>
                            <option value="">-- Seleccione un destinatario --</option>
                            <option value="" disabled>--- Tutores ---</option>
                            {% for tutor in tutores %}
                            <option value="{{ tutor.usuario.id }}" data-tipo="tutor">{{ tutor.usuario.get_full_name }}</option>
                            {% endfor %}
                            <option value="" disabled>--- Emprendedores ---</option>
                            {% for emprendedor in emprendedores %}
                            <option value="{{ emprendedor.id }}" data-tipo="emprendedor">{{ emprendedor.get_full_name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="asunto" class="form-label">Asunto</label>
                        <input type="text" name="asunto" class="form-control" id="asunto" required>
                    </div>
                    <div class="mb-3">
                        <label for="contenido" class="form-label">Mensaje</label>
                        <textarea name="contenido" class="form-control" id="contenido" rows="4" required></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Enviar Mensaje</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
