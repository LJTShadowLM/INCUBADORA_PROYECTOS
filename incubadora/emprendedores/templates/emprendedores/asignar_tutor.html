{% extends "emprendedores/base.html" %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h3 class="mb-0">Asignar Tutor a Proyecto</h3>
                </div>
                <div class="card-body">
                    <h4>Proyecto: {{ proyecto.nombre_proyecto }}</h4>
                    <p class="text-muted">Emprendedor: {{ proyecto.nombre_completo }}</p>
                    
                    <form method="post">
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            <label class="form-label">Seleccionar tutor:</label>
                            <select name="tutor_id" class="form-select" required>
                                <option value="">-- Seleccione un tutor --</option>
                                {% for tutor in tutores %}
                                <option value="{{ tutor.id }}" 
                                    {% if tutor.proyectos_actuales >= tutor.max_proyectos %}disabled{% endif %}>
                                    {{ tutor.usuario.get_full_name }} ({{ tutor.especialidades }})
                                    - Proyectos: {{ tutor.proyectos_actuales }}/{{ tutor.max_proyectos }}
                                    {% if tutor.proyectos_actuales >= tutor.max_proyectos %} - LÍMITE ALCANZADO{% endif %}
                                </option>
                                {% endfor %}
                            </select>
                            <div class="form-text">Solo se pueden seleccionar tutores con disponibilidad</div>
                        </div>
                        
                        <button type="submit" class="btn btn-success w-100 py-2">
                            <i class="bi bi-person-check"></i> Asignar Tutor
                        </button>
                        <a href="{% url 'panel_admin' %}" class="btn btn-secondary w-100 mt-2">Cancelar</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
