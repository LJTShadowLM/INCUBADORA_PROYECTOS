{% extends "emprendedores/base.html" %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h3 class="mb-0">Asignar Gestor de Ciencias a Proyecto</h3>
                </div>
                <div class="card-body">
                    <h4>Proyecto: {{ proyecto.nombre_proyecto }}</h4>
                    <p class="text-muted">Emprendedor: {{ proyecto.nombre_completo }}</p>
                    
                    <form method="post">
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            <label class="form-label">Seleccionar gestor de ciencias:</label>
                            <select name="gestor_id" class="form-select" required>
                                <option value="">-- Seleccione un gestor de ciencias --</option>
                                {% for gestor in gestores %}
                                <option value="{{ gestor.id }}" 
                                    {% if gestor.proyectos_actuales >= gestor.max_proyectos %}disabled{% endif %}>
                                    {{ gestor.usuario.get_full_name }} ({{ gestor.especialidades }})
                                    - Proyectos: {{ gestor.proyectos_actuales }}/{{ gestor.max_proyectos }}
                                    {% if gestor.proyectos_actuales >= gestor.max_proyectos %} - LÍMITE ALCANZADO{% endif %}
                                </option>
                                {% endfor %}
                            </select>
                            <div class="form-text">Solo se pueden seleccionar gestores de ciencias con disponibilidad</div>
                        </div>
                        
                        <button type="submit" class="btn btn-success w-100 py-2">
                            <i class="bi bi-person-check"></i> Asignar Gestor de Ciencias
                        </button>
                        <a href="{% url 'panel_admin' %}" class="btn btn-secondary w-100 mt-2">Cancelar</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
